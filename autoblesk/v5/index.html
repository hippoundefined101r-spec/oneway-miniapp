<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>АВТОБЛЕСК</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}iframe{display:block;width:100%;height:100%;border:0;background:#050505}</style></head><body><iframe id="app" src="../v4/?embedded=1" allow="camera; clipboard-write"></iframe><script>const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const WA='79882155533';const frame=document.getElementById('app');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;try{w.submitLead=function(){const n=d.getElementById('name');const p=d.getElementById('phone');const m=d.getElementById('messenger');if(!n?.value.trim()||!p?.value.trim())return w.alert('Укажите имя и телефон');const rows=[...d.querySelectorAll('#summary .row')];const read=(label)=>{const r=rows.find(x=>x.querySelector('span')?.textContent.trim()===label);return r?.querySelector('b')?.textContent.trim()||''};const text=['Здравствуйте! Хочу оставить заявку в АВТОБЛЕСК.','',`🚗 Авто: ${read('Авто')||'не указано'}`,`🛠 Задача: ${read('Задача')||'не указано'}`,`📷 Фото: ${read('Фото')||'нет'}`,`🕒 Время: ${read('Время')||'уточнить'}`,'',`👤 Имя: ${n.value.trim()}`,`📞 Телефон: ${p.value.trim()}`,`💬 Удобная связь: ${m?.value||'не указано'}`].join('\n');const url='https://wa.me/'+WA+'?text='+encodeURIComponent(text);try{localStorage.setItem('autoblesk_last_lead',JSON.stringify({text,createdAt:new Date().toISOString()}))}catch(e){}if(tg?.HapticFeedback)tg.HapticFeedback.impactOccurred('medium');if(tg?.openLink){tg.openLink(url)}else{window.open(url,'_blank')}};const success=d.querySelector('#success p');if(success)success.textContent='После нажатия откроется WhatsApp с готовой заявкой — останется только отправить сообщение.'}catch(e){console.error(e)}});</script></body></html>
