<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>АВТОБЛЕСК</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}iframe{display:block;width:100%;height:100%;border:0;background:#050505}</style></head><body><iframe id="app" src="../v4/?embedded=1" allow="camera; clipboard-write"></iframe><script>const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const WORKER='https://oneway-miniapp.hippoundefined101r.workers.dev/lead';const frame=document.getElementById('app');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;try{w.submitLead=async function(){const n=d.getElementById('name');const p=d.getElementById('phone');const m=d.getElementById('messenger');if(!n?.value.trim()||!p?.value.trim())return w.alert('Укажите имя и телефон');const rows=[...d.querySelectorAll('#summary .row')];const read=(label)=>{const r=rows.find(x=>x.querySelector('span')?.textContent.trim()===label);return r?.querySelector('b')?.textContent.trim()||''};const lead={car_text:read('Авто'),problem:read('Задача'),photos:read('Фото')||0,when_text:read('Время'),name:n.value.trim(),phone:p.value.trim(),messenger:m?.value||'',createdAt:new Date().toISOString()};const btn=d.querySelector('#contact .cta');if(btn){btn.disabled=true;btn.style.opacity='.65';btn.querySelector('span').textContent='Отправляем...'}try{const r=await fetch(WORKER,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(lead)});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.error||'Ошибка отправки');try{localStorage.setItem('autoblesk_last_lead',JSON.stringify(lead))}catch(e){}if(tg?.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');const success=d.querySelector('#success p');if(success)success.textContent='Заявка отправлена менеджеру. С вами свяжутся для подтверждения.';w.go('success',5)}catch(e){console.error(e);w.alert('Не удалось отправить заявку. Проверьте соединение и попробуйте ещё раз.')}finally{if(btn){btn.disabled=false;btn.style.opacity='1';btn.querySelector('span').textContent='Отправить заявку'}}};const success=d.querySelector('#success p');if(success)success.textContent='Заявка отправлена менеджеру. С вами свяжутся для подтверждения.'}catch(e){console.error(e)}});</script></body></html>
