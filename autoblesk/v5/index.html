<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>АВТОБЛЕСК</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}iframe{display:block;width:100%;height:100%;border:0;background:#050505}</style></head><body><iframe id="app" src="../v4/?embedded=1" allow="camera; clipboard-write"></iframe><script>const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const frame=document.getElementById('app');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;try{w.submitLead=function(){const n=d.getElementById('name');const p=d.getElementById('phone');const m=d.getElementById('messenger');const dt=d.getElementById('date');if(!n?.value.trim()||!p?.value.trim())return w.alert('Укажите имя и телефон');const S=w.S||{};const lead={...S,date:dt?.value||'',name:n.value.trim(),phone:p.value.trim(),messenger:m?.value||'',createdAt:new Date().toISOString()};try{localStorage.setItem('autoblesk_last_lead',JSON.stringify(lead))}catch(e){}if(!tg||typeof tg.sendData!=='function'){return w.alert('Откройте запись через кнопку бота в Telegram')}try{tg.sendData(JSON.stringify(lead));setTimeout(()=>{try{tg.close()}catch(e){}},250)}catch(e){console.error(e);w.alert('Не удалось отправить заявку. Попробуйте ещё раз.')}};const success=d.querySelector('#success p');if(success)success.textContent='Заявка отправлена менеджеру. С вами свяжутся для подтверждения.'}catch(e){console.error(e)}});</script></body></html>
