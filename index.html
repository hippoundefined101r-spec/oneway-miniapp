<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070b"><title>OneWay Detailing — Wycena</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header class="topbar"><button class="brand" data-go="home"><span class="brand-logo">OW</span><span class="brand-copy"><b>ONEWAY</b><small>DETAILING</small></span></button><div class="langs"><button data-lang="pl" class="active">PL</button><button data-lang="en">EN</button><button data-lang="ru">RU</button></div></header><section id="home" class="screen active"><div class="hero"><div class="hero-photo"></div><div class="hero-copy"><span class="eyebrow" data-t="heroEyebrow"></span><h1 data-t="heroTitle"></h1><p data-t="heroSub"></p><div class="cta-row"><button class="primary" data-go="car" data-t="heroCta"></button><div class="rating"><b>★ 4.9</b><small data-t="reviews"></small></div></div></div></div><div class="stats"><div><b>300+</b><span data-t="cars"></span></div><div><b>PL / EN / RU</b><span data-t="langs"></span></div><div><b>100%</b><span>premium quality</span></div></div><div class="service-list"><button class="service-link" data-service-shortcut="ppf"><span class="ico">◫</span><span><b>PPF</b><small data-t="svcPpf"></small></span><span class="arr">›</span></button><button class="service-link" data-service-shortcut="color"><span class="ico">◩</span><span><b data-t="svcColor"></b><small>Wrap / Color PPF</small></span><span class="arr">›</span></button><button class="service-link" data-service-shortcut="ceramic"><span class="ico">◇</span><span><b data-t="svcCeramic"></b><small>Ochrona lakieru</small></span><span class="arr">›</span></button><button class="service-link" data-service-shortcut="detailing"><span class="ico">✦</span><span><b>Detailing</b><small>Kompleksowa pielęgnacja</small></span><span class="arr">›</span></button></div><div class="progress"><div class="active"><span>1</span>WYBIERZ AUTO</div><div><span>2</span>DOPASUJ USŁUGI</div><div><span>3</span>WYŚLIJ ZAPYTANIE</div></div></section><section id="car" class="screen"><div class="step-head"><button class="back" data-go="home">←</button><div><small data-t="step1"></small><h2 data-t="chooseCar"></h2></div></div><div class="panel"><label data-t="search"></label><div class="search-box"><span>⌕</span><input id="carSearch" autocomplete="off" data-ph="searchPh"></div><div id="results" class="results hidden"></div></div><div id="selectedCar" class="panel selected-car hidden"></div><div class="panel"><div class="selected-car"><div><b data-t="manual"></b></div><button id="manualToggle" class="secondary" data-t="manualBtn"></button></div></div><div id="manualForm" class="panel manual hidden"><input id="manualMake" data-ph="make"><input id="manualModel" data-ph="model"><input id="manualYear" data-ph="year"><button id="manualSave" class="secondary full" data-t="save"></button></div><button id="carNext" class="primary full disabled" data-t="nextService"></button></section><section id="service" class="screen"><div class="step-head"><button class="back" data-go="car">←</button><div><small data-t="step2"></small><h2 data-t="chooseService"></h2></div></div><div id="carChip" class="panel car-chip"></div><div class="tabs"><button data-service="ppf" class="active">PPF</button><button data-service="color" data-t="color"></button><button data-service="ceramic" data-t="ceramic"></button><button data-service="detailing">Detailing</button></div><div id="serviceContent"></div><button id="serviceNext" class="primary full disabled" data-t="nextSummary"></button></section><section id="summary" class="screen"><div class="step-head"><button class="back" data-go="service">←</button><div><small data-t="step3"></small><h2 data-t="summary"></h2></div></div><div id="summaryCard" class="panel summary"></div><div class="panel"><h3 data-t="location"></h3><label class="radio"><input type="radio" name="loc" checked><span><b>Odlewnicza 4</b><small>03-231 Warszawa</small></span></label><label class="radio"><input type="radio" name="loc"><span><b>Aleja Krakowska 155</b><small>02-180 Warszawa</small></span></label></div><div class="panel lead"><h3 data-t="contact"></h3><input id="leadName" data-ph="name"><input id="leadPhone" data-ph="phone" inputmode="tel"><select><option>WhatsApp</option><option>Telefon</option><option>Telegram</option></select><label class="consent"><input id="consent" type="checkbox"><span data-t="consent"></span></label><button id="sendLead" class="primary full disabled" data-t="send"></button></div><p class="fine">Orientacyjna cena nie jest ofertą handlową. Finalna wycena zależy od modelu, stanu lakieru i zakresu prac.</p></section><section id="success" class="screen success"><div class="success-icon">✓</div><h2 data-t="thanks"></h2><p data-t="thanksText"></p><button class="primary full" data-go="home" data-t="backHome"></button></section></main><script src="cars.js"></script><script src="app.js"></script></body></html>
